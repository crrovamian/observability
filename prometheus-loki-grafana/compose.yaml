services:
  # ==================== MÉTRICAS ====================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - monitoring

  # ==================== LOGS ====================
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - monitoring

  # ==================== VISUALIZACIÓN ====================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin  # Cámbialo en producción
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=grafana-clock-panel

    ports:
      - "3001:3000"
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki

  # Exportador de métricas de Docker (opcional pero recomendado)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - monitoring

  # Exportador de métricas del sistema (opcional)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    restart: unless-stopped
    networks:
      - monitoring

  # ==================== TRAZAS Y LOGS ====================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    user: root
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml
      - otelcol_data:/var/lib/otelcol
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - loki
      - tempo

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command:
      - '-config.file=/etc/tempo.yaml'
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    restart: unless-stopped
    networks:
      - monitoring

volumes:
  # Bind-mount local (requiere mkdir -p data/prometheus)
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/prometheus
  # Alternativa: volúmenes gestionados por Docker
  # prometheus_data:
  #   driver: local
      
  # Bind-mount local (requiere mkdir -p data/grafana)
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/grafana
  # Alternativa: volúmenes gestionados por Docker
  # grafana_data:
  #   driver: local
      
  # Bind-mount local (requiere mkdir -p data/loki)
  loki_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/loki
  # Alternativa: volúmenes gestionados por Docker
  # loki_data:
  #   driver: local

  # Bind-mount local (requiere mkdir -p data/tempo)
  tempo_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/tempo
  # Alternativa: volúmenes gestionados por Docker
  # tempo_data:
  #   driver: local

  # Bind-mount local (requiere mkdir -p data/otel-collector)
  otelcol_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/otel-collector
  # Alternativa: volúmenes gestionados por Docker
  # otelcol_data:
  #   driver: local

networks:
  monitoring:
    external: true
